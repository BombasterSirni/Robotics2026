name: PR01 — проверка отчёта

on: [push, pull_request]

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w02-5d210c431e32.tar.gz
      COURSE_KIT_SHA256: 5d210c431e32418f45e2cffa9dd2028116c7a9520a36f3c7079c778cd73437a8
    steps:
      - name: Получить всю историю коммитов
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Скачать и подготовить комплект курса во временной папке
        shell: bash
        run: |
          # Создаем временную директорию ВНЕ git workspace или используем /tmp
          export KIT_DIR=$(mktemp -d)
          
          curl -fsSLo "$KIT_DIR/course-kit.tar.gz" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$KIT_DIR/course-kit.tar.gz" | sha256sum -c -
          
          mkdir -p "$KIT_DIR/.course-kit"
          tar -xzf "$KIT_DIR/course-kit.tar.gz" -C "$KIT_DIR/.course-kit"
          
          # Сохраняем путь для следующего шага
          echo "KIT_PATH=$KIT_DIR/.course-kit" >> $GITHUB_ENV

      - name: Проверить JSON и совпадение версии архива
        shell: bash
        run: |
          python3 -m json.tool evidence/pr01/environment.json > /dev/null
          python3 -m json.tool evidence/pr01/report.json > /dev/null
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr01/report.json').read_text())
          if report['course_kit']['archive_sha256'] != os.environ['COURSE_KIT_SHA256']:
              raise SystemExit('SHA-256 комплекта в отчёте отличается от архива CI')
          PYTHON

      - name: Проверить комплектность evidence и коммит реализации
        shell: bash
        
        run: |
          python3 "$KIT_PATH/v1/tools/check_practice.py" PR01 --submission .