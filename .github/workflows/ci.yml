name: PR02 — проверка отчёта

on: [push, pull_request]

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Даем больше времени на установку ROS
    env:
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w03-7fbfd3e8161a.tar.gz
      COURSE_KIT_SHA256: 7fbfd3e8161ab6c6ebefc7663efdaf77d9a7d490399743507f33dcefbd5ac522
    
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- ШАГ УСТАНОВКИ ROS ЧЕРЕЗ ACTION ---
      - name: Set up ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install build dependencies
        shell: bash
        run: |
          # setup-ros обычно ставит базу, но colcon и dev-tools нужно проверить
          sudo apt-get update
          sudo apt-get install -y python3-colcon-common-extensions python3-pip git curl gnupg lsb-release
          
      - name: Build turtle_bringup
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          
          echo "Building package..."
          colcon build --symlink-install --packages-select turtle_bringup
          
          echo "Verifying launch file existence..."
          source install/setup.bash
          LAUNCH_FILE=$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py
          
          if [ ! -f "$LAUNCH_FILE" ]; then
            echo "Error: Launch file not found at $LAUNCH_FILE"
            exit 1
          fi
          
          echo "Checking Python syntax..."
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
          
          echo "Build successful."

      # --- ОСТАЛЬНЫЕ ШАГИ БЕЗ ИЗМЕНЕНИЙ ---
      
      - name: Download course kit
        shell: bash
        run: |
          export KIT_DIR=$(mktemp -d)
          curl -fsSLo "$KIT_DIR/course-kit.tar.gz" "$COURSE_KIT_URL"
          printf '%s  %s\n' "$COURSE_KIT_SHA256" "$KIT_DIR/course-kit.tar.gz" | sha256sum -c -
          mkdir -p "$KIT_DIR/.course-kit"
          tar -xzf "$KIT_DIR/course-kit.tar.gz" -C "$KIT_DIR/.course-kit"
          echo "KIT_PATH=$KIT_DIR/.course-kit" >> $GITHUB_ENV

      - name: Проверить JSON и совпадение версии архива
        shell: bash
        run: |
          python3 -m json.tool evidence/pr02/environment.json > /dev/null
          python3 -m json.tool evidence/pr02/report.json > /dev/null
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path('evidence/pr02/report.json').read_text())
          if report['course_kit']['archive_sha256'] != os.environ['COURSE_KIT_SHA256']:
              raise SystemExit('SHA-256 комплекта в отчёте отличается от архива CI')
          PYTHON

      - name: Check PR evidence
        shell: bash
        run: |
          python3 "$KIT_PATH/v1/tools/check_practice.py" PR02 --submission .